<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dnd-virtual-tabletop</title>
  </head>

  <body>
    <!--LANGUAGE-->
    <select id="language">
      <option value="en">English</option>
      <option value="pt">Português</option>
    </select>

    <!--LAYERS-->
    <button id="remove-layer">−</button>
    <span data-i18n="layer">Layer</span>
    <button id="add-layer">+</button>

    <div id="layers">
      <button id="previous-layer">&lt;</button>
      <span id="current-layer">1</span>
      <button id="next-layer">&gt;</button>
    </div>

    <!--MAP SIZE-->
    <button id="map-size" data-i18n="map"></button>

    <div id="map-size-panel" style="display: none">
      <label for="map-width-input" data-i18n="width"></label>
      <input id="map-width-input" type="number" min="5" step="5" value="100" />

      <label for="map-height-input" data-i18n="height"></label>
      <input id="map-height-input" type="number" min="5" step="5" value="100" />

      <div id="map-size-error" style="display: none"></div>

      <button id="map-size-apply" data-i18n="apply"></button>
      <button id="map-size-cancel" data-i18n="cancel"></button>
    </div>

    <!--TERRAIN-->
    <div id="toolbar">
      <div id="tools">
        <button data-tool="brush" data-i18n="brush"></button>
        <button data-tool="rectangle" data-i18n="rectangle"></button>
        <button data-tool="fill" data-i18n="fill"></button>
      </div>

      <!--GRASS-->
      <div id="terrain-selector">
        <button
          id="terrain-grass-button"
          type="button"
          data-i18n="grass"
        ></button>
        <div id="terrain-grass-menu" class="terrain-menu"></div>
      </div>

      <!--WATER-->
      <div id="terrain-selector">
        <button
          id="terrain-water-button"
          type="button"
          data-i18n="water"
        ></button>
        <div id="terrain-water-menu" class="terrain-menu"></div>
      </div>

      <!--SAND-->
      <div id="terrain-selector">
        <button
          id="terrain-sand-button"
          type="button"
          data-i18n="sand"
        ></button>
        <div id="terrain-sand-menu" class="terrain-menu"></div>
      </div>

      <button data-terrain="empty" data-i18n="erase"></button>
      <button id="empty-all" data-i18n="eraseAll"></button>
    </div>

    <!--CHARACTER-->
    <div id="character-bar">
      <button data-tool="character-add" data-i18n="addCharacter"></button>
      <button data-tool="character-select" data-i18n="selectCharacter"></button>
      <button data-tool="character-erase" data-i18n="eraseCharacter"></button>
      <button id="erase-all-characters" data-i18n="eraseAllCharacters"></button>
    </div>

    <!--OBJECT-->
    <div id="object-bar">
      <span>Objects</span>
      <br />
      <div></div>
      <button data-object-tool="object-brush" data-i18n="brush"></button>
      <button
        data-object-tool="object-rectangle"
        data-i18n="rectangle"
      ></button>
      <button data-object-tool="object-fill" data-i18n="fill"></button>
      <button data-object-tool="object-erase" data-i18n="erase"></button>
      <button id="erase-all-objects" data-i18n="eraseAll"></button>
      <div>
        <button data-object-type="boulder" data-i18n="boulder"></button>
        <button data-object-type="tree" data-i18n="tree"></button>
      </div>
      <div>
        <button id="object-settings" data-i18n="settings"></button>

        <div id="object-settings-panel" style="display: none">
          <label>
            <span data-i18n="width"></span>
            <input id="object-width" type="number" min="1" max="100" />
          </label>

          <label
            ><span data-i18n="height"></span
            ><input id="object-height" type="number" min="1" max="100"
          /></label>

          <p id="object-settings-error" style="display: none"></p>
          <button id="object-settings-apply" data-i18n="apply"></button>
          <button id="object-settings-cancel" data-i18n="cancel"></button>
        </div>
        <button data-object-tool="object-select" data-i18n="select">
          Select
        </button>
      </div>
    </div>
    <div id="game"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
