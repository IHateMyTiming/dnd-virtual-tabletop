<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dnd-virtual-tabletop</title>
  </head>

  <body>
    <select id="language">
      <option value="en">English</option>
      <option value="pt">Português</option>
    </select>

    <button id="remove-layer">−</button>

    <span data-i18n="layer">Layer</span>

    <button id="add-layer">+</button>

    <div id="layers">
      <button id="previous-layer">&lt;</button>
      <span id="current-layer">1</span>
      <button id="next-layer">&gt;</button>
    </div>

    <div id="toolbar">
      <div id="tools">
        <button data-tool="brush" data-i18n="brush">Brush</button>
        <button data-tool="rectangle" data-i18n="rectangle">Rectangle</button>
        <button data-tool="fill" data-i18n="fill">Fill</button>
      </div>

      <button data-terrain="floor" data-i18n="floor">Floor</button>
      <button data-terrain="wall" data-i18n="wall">Wall</button>
      <button data-terrain="water" data-i18n="water">Water</button>
      <button data-terrain="grass" data-i18n="grass">Grass</button>
      <button data-terrain="mud" data-i18n="mud">Mud</button>
      <button data-terrain="lava" data-i18n="fire">Fire</button>
      <button data-terrain="sand" data-i18n="sand">Sand</button>
      <button data-terrain="empty" data-i18n="erase">Erase</button>
      <button id="empty-all" data-i18n="eraseAll">Erase All</button>
    </div>

    //REMINDER TO TAKE THE BR OF THE CODE LATER
    <div id="character-bar">
      <button data-tool="character" data-i18n="addCharacter">
        Add / Move Character
      </button>
      <button data-tool="character-erase" data-i18n="eraseCharacter">
        Erase Character
      </button>
      <button id="erase-all-characters" data-i18n="eraseAllCharacters">
        Erase All Characters
      </button>
    </div>

    <div id="object-bar">
      <span>Objects</span>
      <br />

      <button data-object-tool="object-brush" data-i18n="brush">Brush</button>
      <button data-object-tool="object-rectangle" data-i18n="rectangle">
        Rectangle
      </button>
      <button data-object-tool="object-fill" data-i18n="fill">Fill</button>
      <button data-object-tool="object-erase" data-i18n="erase">Erase</button>
      <button id="erase-all-objects" data-i18n="eraseAll">Erase All</button>

      <br />
      <button data-object-type="boulder" data-i18n="boulder">Boulder</button>
      <button data-object-type="tree" data-i18n="tree">Tree</button>
      <br />
      <button id="object-settings" data-i18n="settings">Settings</button>
      <div id="object-settings-panel" style="display: none">
        <label>
          Width
          <input id="object-width" type="number" min="1" />
        </label>

        <label>
          Height
          <input id="object-height" type="number" min="1" />
        </label>

        <button id="object-settings-apply">Apply</button>
        <button id="object-settings-cancel">Cancel</button>
      </div>
      <button data-object-tool="object-select" data-i18n="select">
        Select
      </button>
    </div>

    <div id="game"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
