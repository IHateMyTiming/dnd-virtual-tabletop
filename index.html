<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dnd-virtual-tabletop</title>
  </head>
  <body>
    <div id="toolbar">
      <div id="tools">
        <button data-tool="brush">Brush</button>
        <button data-tool="rectangle">Rectangle</button>
        <button data-tool="fill">Fill</button>
      </div>

      <button data-terrain="floor">Floor</button>
      <button data-terrain="wall">Wall</button>
      <button data-terrain="water">Water</button>
      <button data-terrain="grass">Grass</button>
      <button data-terrain="mud">Mud</button>
      <button data-terrain="lava">Fire</button>
      <button data-terrain="sand">Sand</button>
      <button data-terrain="empty">Erase</button>
      <button id="empty-all">Erase All</button>
    </div>

    <div id="game"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
