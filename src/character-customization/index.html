<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Character Creation</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="character-creator">
      <h1>Character Creation</h1>

      <!-- CHARACTER PREVIEW -->
      <div id="character-preview">
        <img id="preview-cape-bottom" alt="" />
        <img id="preview-body" alt="" />
        <img id="preview-skin" alt="" />
        <img id="preview-cape-top" alt="" />
        <img id="preview-head" alt="" />
        <img id="preview-hair" alt="" />
      </div>

      <!-- COLOR -->
      <section class="customization-section">
        <h2>Color</h2>

        <div id="color-options" class="options"></div>
      </section>

      <!-- HAIR -->
      <section class="customization-section">
        <h2>Hair</h2>

        <div class="selector">
          <button id="hair-previous">&lt;</button>

          <div class="option-preview">
            <div id="hair-option-none" class="none-option">🚫</div>
            <img id="hair-option-image" alt="" />
            <span id="hair-option-name"></span>
          </div>

          <button id="hair-next">&gt;</button>
        </div>
      </section>

      <!-- HAIR COLOR-->
      <h2>Hair Color</h2>

      <div class="selector">
        <button id="hair-color-previous">&lt;</button>

        <div class="option-preview">
          <span id="hair-color-name"></span>
        </div>

        <button id="hair-color-next">&gt;</button>
      </div>

      <!-- BODY -->
      <section class="customization-section">
        <h2>Body</h2>

        <div class="selector">
          <button id="body-previous">&lt;</button>

          <div class="option-preview">
            <img id="body-option-image" alt="" />
            <span id="body-option-name"></span>
          </div>

          <button id="body-next">&gt;</button>
        </div>
      </section>

      <!-- CAPE -->
      <section class="customization-section">
        <h2>Cape</h2>

        <div class="selector">
          <button id="cape-previous">&lt;</button>

          <div class="option-preview">
            <div id="cape-option-none" class="none-option">🚫</div>
            <img id="cape-option-image" alt="" />
            <span id="cape-option-name"></span>
          </div>

          <button id="cape-next">&gt;</button>
        </div>
      </section>

      <button id="create-character">Create Character</button>
    </div>

    <button id="back-to-map">Back to Map</button>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
